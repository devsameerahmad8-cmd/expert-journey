<div class="inner-page">
  <div class="container">
    <div class="card-form-shell">

      <header class="form-head">
        <h1>تعديل بيانات البطاقة الجمركية</h1>
        <p class="hint">
          هذا النموذج مخفي ولا يظهر في القوائم. يتم حفظ التعديلات في المتصفح
          (localStorage). لتحديث الملف الافتراضي
          <code>assets/card-data.json</code> اضغط
          <strong>تحميل JSON</strong> واستبدل الملف على القرص.
        </p>
      </header>

      <div *ngIf="saved" class="alert alert-success">تم الحفظ في المتصفح.</div>

      <form [formGroup]="form" (ngSubmit)="save()" novalidate>
        <div class="form-grid">
          <div class="form-field" *ngFor="let f of fields">
            <label [for]="f.name">{{ f.label }}</label>
            <textarea
              *ngIf="f.type === 'textarea'; else inputField"
              [id]="f.name"
              [formControlName]="f.name"
              rows="2"></textarea>
            <ng-template #inputField>
              <input
                type="text"
                [id]="f.name"
                [formControlName]="f.name">
            </ng-template>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">حفظ</button>
          <button type="button" class="btn btn-success" (click)="viewCard()">
            حفظ وعرض البطاقة
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="download()">
            تحميل JSON
          </button>
          <button type="button" class="btn btn-outline-danger ms-auto" (click)="reset()">
            استعادة الإعدادات الافتراضية
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
