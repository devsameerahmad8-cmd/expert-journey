<!-- Mirrors original DOM order: header (sticky wrapper) wraps top-header + nav,
     then body-wrapper splits into sidebar (col-lg-2) + main (col-lg-10),
     then footer. Routed view ('' = verification, 'form' = hidden editor)
     renders in the main column via <router-outlet>. -->
<div class="header sticky">
  <app-top-header></app-top-header>
  <app-header></app-header>
</div>

<div class="d-flex position-relative body-wrapper">
  <div id="divSideMenuContainer" class="col-lg-2">
    <app-sidebar></app-sidebar>
  </div>
  <div class="col-lg-10 dga-main-container">
    <router-outlet></router-outlet>
  </div>
</div>

<app-footer></app-footer>
